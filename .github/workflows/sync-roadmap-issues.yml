name: Sync Roadmap to GitHub Issues

on:
  push:
    # `branches` cannot take an expression; the job runs only on the default branch (see its `if`).
    paths:
      - ROADMAP.md
      - specs/*/spec.md
      - specs/*/plan.md
      - specs/*/tasks.md
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (otherwise print a dry run)'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync:
    # Push and manual runs must be on the default branch, whatever it is called. A schedule always runs
    # on it, and its payload has no `repository` (so `default_branch` would be empty there).
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # On the job, not the workflow: a skipped feature-branch run must not cancel a pending run on the
    # default branch. Read-only previews must not replace a pending issue-mutating sync.
    concurrency:
      # Applying runs have their own group, apart from the Phase sync's `issue-sync`: one merge of a
      # tasks.md change starts both syncs, and a group holds one running and one pending job, so a
      # shared group could drop one of them. Running side by side is safe: both syncs are
      # idempotent and find their issues by marker, and the roadmap sync leaves Phase issues to the
      # Phase sync once tasks.md exists. A push may apply (see the sync step) unless the switch is
      # off. Expressions ignore case but cannot trim, so the step below ignores case too and rejects
      # a padded value: ` false ` takes the apply group here and then fails there, consistently.
      group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.apply == true) || (github.event_name == 'push' && vars.ROADMAP_SYNC_AUTO_APPLY != 'false')) && 'issue-sync-roadmap' || 'issue-sync-preview' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on a schedule (no `repository` in its payload); then the default is the event's ref.
          ref: ${{ github.event.repository.default_branch || github.ref }}
          persist-credentials: false

      - name: Set up the board credential
        id: board
        uses: ./.github/actions/board-token
        with:
          client-id: ${{ secrets.PROJECT_STATUS_APP_ID }}
          private-key: ${{ secrets.PROJECT_BOARD_APP_PRIVATE_KEY }}
          has-board-pat: ${{ secrets.PROJECT_BOARD_TOKEN != '' }}

      - name: Synchronize roadmap issues
        env:
          # Unbuffered, so a failure prints in order with the script output in the log.
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
          # App token first; PROJECT_BOARD_TOKEN only once the project context is read.
          BOARD_GH_TOKEN: ${{ steps.board.outputs.token || (steps.board.outputs.owner != '' && secrets.PROJECT_BOARD_TOKEN) || '' }}
          APPLY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
          # `false` (any case) turns automatic apply on push off; unset or `true` leaves it on; any
          # other value, including one with surrounding spaces, fails the push run.
          AUTO_APPLY: ${{ vars.ROADMAP_SYNC_AUTO_APPLY }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$APPLY_REQUESTED" == "true" ]]; then
            args+=(--apply)
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            switch=$(printf '%s' "$AUTO_APPLY" | tr '[:upper:]' '[:lower:]')
            case "$switch" in
              false)
                echo "Automatic apply is off (ROADMAP_SYNC_AUTO_APPLY=false); preview only."
                ;;
              "" | true)
                # The script applies only once a roadmap Epic exists; the first sync stays manual.
                args+=(--apply-if-synced)
                ;;
              *)
                echo "::error::ROADMAP_SYNC_AUTO_APPLY must be true or false (any case), not '$AUTO_APPLY'." >&2
                exit 1
                ;;
            esac
          fi
          if [[ -z "$BOARD_GH_TOKEN" ]]; then
            args+=(--skip-project)
            echo "Board sync skipped (see notices above)."
          fi
          python3 scripts/sync-roadmap-issues.py "${args[@]}"
