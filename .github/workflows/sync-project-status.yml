name: Sync project status

on:
  push:
    branches: ['**-phase-**']
  create:
    types: [branch]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  issues:
    types: [closed, reopened, labeled]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Phase issue number; leave empty to reconcile all'
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync:
    if: >-
      (github.event_name != 'workflow_dispatch' ||
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'create' ||
        (github.event.ref_type == 'branch' && contains(github.event.ref, '-phase-')))
    runs-on: ubuntu-latest
    concurrency:
      group: project-status
      cancel-in-progress: false
    env:
      HAS_BOARD_APP: ${{ secrets.PROJECT_STATUS_APP_ID != '' && secrets.PROJECT_BOARD_APP_PRIVATE_KEY != '' }}
      HAS_BOARD_PAT: ${{ secrets.PROJECT_BOARD_TOKEN != '' }}
    steps:
      # Use only trusted base-branch code; pull_request_target must never execute PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read configured Project owner
        id: project-config
        run: |
          # Prints the owner, or a skip notice (no credential, or not initialized yet) and no owner;
          # fails once the repository is initialized and project-context.toml is missing or invalid.
          owner=$(python3 scripts/project_context.py --repository-owner "${GITHUB_REPOSITORY%%/*}" --board-owner-or-skip)
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - name: Read the repository name
        id: repo
        # A schedule payload has no `repository`, so the App token's `repositories` cannot come from the event.
        run: |
          echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create project-scoped token
        id: app-token
        if: ${{ env.HAS_BOARD_APP == 'true' && steps.project-config.outputs.owner != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PROJECT_STATUS_APP_ID }}
          private-key: ${{ secrets.PROJECT_BOARD_APP_PRIVATE_KEY }}
          owner: ${{ steps.project-config.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-issues: read
          permission-organization-projects: write

      - name: Reconcile statuses
        if: ${{ steps.project-config.outputs.owner != '' }}
        env:
          # Unbuffered, so a failure prints in order with the script output in the log.
          PYTHONUNBUFFERED: '1'
          # Repository reads use the workflow token; only Project calls use the board credential.
          GH_TOKEN: ${{ github.token }}
          BOARD_GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PROJECT_BOARD_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.event.ref }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_ISSUE: ${{ inputs.issue }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            python3 scripts/sync-project-status.py --all --apply
            exit
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$DISPATCH_ISSUE" ]]; then
              python3 scripts/sync-project-status.py --issue "$DISPATCH_ISSUE" --apply
            else
              python3 scripts/sync-project-status.py --all --apply
            fi
            exit
          fi

          if [[ "$EVENT_NAME" == "issues" ]]; then
            python3 scripts/sync-project-status.py --issue "$ISSUE_NUMBER" --apply
            exit
          fi

          branch="$PUSH_REF_NAME"
          if [[ "$EVENT_NAME" == "create" ]]; then
            branch="$EVENT_REF"
          elif [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            branch="$PR_HEAD_REF"
          fi

          if ! metadata=$(python3 scripts/pr_conventions.py parse "$branch" 2>/dev/null); then
            echo "Branch '$branch' does not follow an issue branch convention; nothing to do."
            exit 0
          fi
          if [[ "$(jq -r '.branch_type' <<< "$metadata")" != "phase" ]]; then
            echo "Branch '$branch' is not a Phase branch; nothing to do."
            exit 0
          fi

          issue_number=$(jq -r '.issue_number' <<< "$metadata")
          python3 scripts/sync-project-status.py --issue "$issue_number" --apply
